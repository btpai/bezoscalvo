name: Generate Twitch IPTV List
on:
  push:
    paths:
      - "canales.txt"
      - "twitch_iptv_updater.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar lista
        run: bash twitch_iptv_updater.sh

      - name: Guardar cambios
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add twitch_iptv.m3u
          git diff --cached --quiet || git commit -m "Actualizar lista IPTV"
          git push
